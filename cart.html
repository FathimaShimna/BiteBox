<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Bite Box</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/images/logo/logo.ico" type="image/x-icon">

    <!-- FA - Icons -->
    <script src="https://kit.fontawesome.com/c9da710483.js" crossorigin="anonymous"></script>

    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">



</head>

<body>
    <header class="flex justify-content-between align-items-center position-fixed bg-dark">
        <div class="flex justify-content-between align-items-center">
            <img class='h-100' src="assets/images/logo/logo.png" alt="">
            <h1>
                Bitebox
            </h1>
        </div>
        <nav>
            <ul class="flex justify-content-between align-items-center gap-basic">
                <li class="no-decoration">
                    <a class="no-decoration hover-yellow " href="index.html">
                        <i class="fa-regular fa-house"></i>
                    </a>
                </li>
                <li class="no-decoration">
                    <a class="no-decoration hover-yellow" href="menu.html">Menu</a>
                </li>
                <li class="no-decoration">
                    <a class="no-decoration hover-yellow" href="">About</a>
                </li>
                <li class="no-decoration">
                    <a class="no-decoration hover-yellow" href="">Contact</a>
                </li>
                <li class="no-decoration">
                    <a class="no-decoration hover-yellow" href="cart.html">Cart</a>
                </li>
                <li class="no-decoration">
                    <a href="login.html" class="btn login">Login <i class="fa-solid fa-right-to-bracket"></i></a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="cart">

            <h2>My Cart</h2>

            <div class="cart-container">

                <!-- Item -->
                <div class="cart-item basic-shadow">

                    <img src="assets/images/burger.png" alt="Burger">

                    <div class="cart-details">
                        <h3>Burger</h3>
                        <p>₹199</p>

                        <div class="cart-controls">
                            <button class="btn">−</button>

                            <span class="qty">1</span>

                            <button class="btn">+</button>

                            <button class="btn remove-btn">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <strong>₹199</strong>

                </div>

                <!-- Item -->
                <div class="cart-item basic-shadow">

                    <img src="assets/images/burger.png" alt="Pizza">

                    <div class="cart-details">
                        <h3>Veg Pizza</h3>
                        <p>₹349</p>

                        <div class="cart-controls">
                            <button class="btn">−</button>

                            <span class="qty">2</span>

                            <button class="btn">+</button>

                            <button class="btn remove-btn">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <strong>₹698</strong>

                </div>

            </div>

            <div class="cart-summary basic-shadow">

                <h3>Order Summary</h3>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹897</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span>₹40</span>
                </div>

                <div class="summary-row">
                    <strong>Total</strong>
                    <strong>₹937</strong>
                </div>

                <button class="btn checkout-btn">
                    Checkout
                </button>

            </div>
        </section>
    </main>

    <footer class="position-fixed bg-dark">
        &copy; 2026
    </footer>
</body>

</html>
