<body>
    <header class="flex justify-content-between align-items-center position-fixed bg-dark">
        <div class="flex justify-content-between align-items-center">
            <img class='h-100' src="assets/images/logo/logo_without_bg.png" alt="">
            <h1>
                Bitebox
            </h1>
        </div>
        <nav>
            <ul class="flex justify-content-between align-items-center gap-basic">
                <li class="no-decoration">
                    <a class="no-decoration hover-yellow " href="index.html">
                        <i class="fa-regular fa-house"></i>
                    </a>
                </li>
                <li class="no-decoration">
                    <a class="no-decoration hover-yellow" href="menu.html">Menu</a>
                </li>
                <li class="no-decoration">

                <li class="no-decoration">

                <li class="no-decoration">

        <section id="auth-container" class="basic-shadow round-border p-10">
            <h3>
                Login to Bite<span class="red">Box</span>
            </h3>
            <form class="flex justify-content-between align-items-center p-10">
                <fieldset class="flex justify-content-between align-items-center gap-basic">
                    <div class="form-field">
                        <label for="username-input">username</label>
                        <input id="username-input" type="text" class="round-border p-5" placeholder="Username">
                    </div>
                    <div class="form-field">
                        <label for="pwd-input">password</label>
                        <input id="pwd-input" type="password" class="round-border p-5" placeholder="Password">
                    </div>
                    <div class="form-buttons">
                        <button class="btn login">
                            Log in
                        </button>
                    </div>
                </fieldset>
                <div>
                    <div>Don't have an account?</div>
                    <div>
                        <a href="register.html">
                            Signup Now
                        </a>
                    </div>
                </div>
            </form>

    <footer class="position-fixed bg-dark">
